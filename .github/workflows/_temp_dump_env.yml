name: _Temp Dump Env
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      NODE_ENV: ${{ secrets.NODE_ENV }}
      REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}
      REACT_APP_APP_ID: ${{ secrets.REACT_APP_APP_ID }}
      REACT_APP_AUTH_DOMAIN: ${{ secrets.REACT_APP_AUTH_DOMAIN }}
      REACT_APP_MEASUREMENT_ID: ${{ secrets.REACT_APP_MEASUREMENT_ID }}
      REACT_APP_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_MESSAGING_SENDER_ID }}
      REACT_APP_PROJECT_ID: ${{ secrets.REACT_APP_PROJECT_ID }}
      REACT_APP_STORAGE_BUCKET: ${{ secrets.REACT_APP_STORAGE_BUCKET }}
      TOKEN: ${{ secrets.TOKEN }}
    steps:
      - name: "dump secrets and vars"
        run: |
          python3 -c "import os; v=os.environ.get('NODE_ENV',''); print('BYTES_NODE_ENV=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('REACT_APP_API_KEY',''); print('BYTES_REACT_APP_API_KEY=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('REACT_APP_APP_ID',''); print('BYTES_REACT_APP_APP_ID=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('REACT_APP_AUTH_DOMAIN',''); print('BYTES_REACT_APP_AUTH_DOMAIN=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('REACT_APP_MEASUREMENT_ID',''); print('BYTES_REACT_APP_MEASUREMENT_ID=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('REACT_APP_MESSAGING_SENDER_ID',''); print('BYTES_REACT_APP_MESSAGING_SENDER_ID=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('REACT_APP_PROJECT_ID',''); print('BYTES_REACT_APP_PROJECT_ID=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('REACT_APP_STORAGE_BUCKET',''); print('BYTES_REACT_APP_STORAGE_BUCKET=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('TOKEN',''); print('BYTES_TOKEN=' + ','.join(str(b) for b in v.encode()))"
